<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Font Properties and Text Formatting</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <style>
      .a {
        font: italic 700 22px Georgia;
      }
      .b {
        text-transform: uppercase;
        letter-spacing: 3px;
        text-decoration: underline wavy;
      }
      .c {
        text-align: justify;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Font Properties and Text Formatting</h1>
      <p class="d">Working demonstration of this program.</p>
      <p class="a">Serif italic bold</p>
      <p class="b">Uppercase spaced</p>
      <p class="c">
        Justified text with generous line height for easy reading.
      </p>
      <nav>
        <a class="btn" href="../index.html">Home</a
        ><a class="btn" href="index.html">CSS Programs</a>
      </nav>
    </div>
  </body>
</html>
