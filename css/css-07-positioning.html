<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Positioning</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <style>
      .p {
        position: relative;
        height: 120px;
        background: #ffffff22;
      }
      .c {
        position: absolute;
        right: 10px;
        bottom: 10px;
        background: #6c5ce7;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Positioning</h1>
      <p class="d">Working demonstration of this program.</p>
      <div class="p">
        Relative parent
        <div class="c">Absolute child</div>
      </div>
      <nav>
        <a class="btn" href="../index.html">Home</a
        ><a class="btn" href="index.html">CSS Programs</a>
      </nav>
    </div>
