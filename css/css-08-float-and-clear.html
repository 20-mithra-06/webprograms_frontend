<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Float and Clear</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <style>
      .l {
        float: left;
        width: 45%;
        background: #6c5ce7;
        padding: 10px;
      }
      .r {
        float: right;
        width: 45%;
        background: #00cec9;
        padding: 10px;
      }
      .cl {
        clear: both;
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Float and Clear</h1>
      <p class="d">Working demonstration of this program.</p>
      <div class="l">Left</div>
      <div class="r">Right</div>
      <div class="cl">Cleared footer</div>
      <nav>
        <a class="btn" href="../index.html">Home</a
        ><a class="btn" href="index.html">CSS Programs</a>
      </nav>
    </div>
  </body>
</html>
