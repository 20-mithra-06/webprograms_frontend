<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Show Hide Password and Content
    </title>
    <link rel="stylesheet" href="../assets/style.css">
  </head>
  <body>
    <div class="wrap">
      <h1>
        Show Hide Password and Content
      </h1>
      <p class="d">
        Working demonstration of this program.
      </p>
      <input id=p type=password value=secret123>
      <button id=b>
        Show / Hide password
      </button>
      <p id=t>
        Secret content
      </p>
      <button id=h>
        Toggle content
      </button>
      <nav>
        <a class="btn" href="../index.html">
          Home
        </a>
        <a class="btn" href="index.html">
          JavaScript Programs
        </a>
      </nav>
    </div>
    <script>
  const $=i=>document.getElementById(i);
  $('b').onclick=()=>$('p').type=$('p').type==='password'?'text':'password';
  $('h').onclick=()=>$('t').hidden=!$('t').hidden;
</script>
  </body>
</html>
