<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Add Options to Select Element
    </title>
    <link rel="stylesheet" href="../assets/style.css">
  </head>
  <body>
    <div class="wrap">
      <h1>
        Add Options to Select Element
      </h1>
      <p class="d">
        Working demonstration of this program.
      </p>
      <div class=row>
        <input id=i placeholder=Option>
        <button id=a style=flex:0>
          Add
        </button>
      </div>
      <select id=s>
      </select>
      <nav>
        <a class="btn" href="../index.html">
          Home
        </a>
        <a class="btn" href="index.html">
          JavaScript Programs
        </a>
      </nav>
    </div>
    <script>
  const $=i=>document.getElementById(i);
  $('a').onclick=()=>{
    if($('i').value){
      $('s').add(new Option($('i').value));
      $('i').value=''
    }
  };
</script>
  </body>
</html>
