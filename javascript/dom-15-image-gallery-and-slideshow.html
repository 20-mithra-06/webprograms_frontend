<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Image Gallery and Slideshow
    </title>
    <link rel="stylesheet" href="../assets/style.css">
  </head>
  <body>
    <div class="wrap">
      <h1>
        Image Gallery and Slideshow
      </h1>
      <p class="d">
        Working demonstration of this program.
      </p>
      <img id=m style="width:100%;height:160px;border-radius:12px">
      <div class=row>
        <button id=p>
          Prev
        </button>
        <button id=n>
          Next
        </button>
      </div>
      <nav>
        <a class="btn" href="../index.html">
          Home
        </a>
        <a class="btn" href="index.html">
          JavaScript Programs
        </a>
      </nav>
    </div>
    <script>
  const $=i=>document.getElementById(i);
  const C=['#6c5ce7','#00cec9','#fd79a8','#fdcb6e'];
  let i=0;
  const show=()=>$('m').src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160"><rect width="400" height="160" fill="'+C[i]+'"/><text x="200" y="95" font-size="40" text-anchor="middle" fill="#fff">Slide '+(i+1)+'</text></svg>');
  $('n').onclick=()=>{
    i=(i+1)%C.length;
    show()
  };
  $('p').onclick=()=>{
    i=(i+C.length-1)%C.length;
    show()
  };
  show();
  setInterval(()=>$('n').click(),3000);
</script>
  </body>
</html>
