<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Password Strength Checker
    </title>
    <link rel="stylesheet" href="../assets/style.css">
  </head>
  <body>
    <div class="wrap">
      <h1>
        Password Strength Checker
      </h1>
      <p class="d">
        Live strength meter with a show/hide option.
      </p>
      <input id=p type=password placeholder=Password>
      <label>
        <input type=checkbox id=s style="width:auto">
        Show password
      </label>
      <div id=b style="height:8px;border-radius:4px;width:0;transition:.3s;margin-top:10px">
      </div>
      <div class=out id=o>
      </div>
      <nav>
        <a class="btn" href="../index.html">
          Home
        </a>
        <a class="btn" href="index.html">
          JavaScript Programs
        </a>
      </nav>
    </div>
    <script>
  const $=i=>document.getElementById(i);
  $('s').onchange=()=>$('p').type=$('s').checked?'text':'password';
  $('p').oninput=()=>{
    const v=$('p').value;
    const n=[/.{
      8,
    }
    /,/[a-z]/,/[A-Z]/,/\d/,/\W/].filter(r=>r.test(v)).length;
    $('o').textContent=['Very weak','Weak','Fair','Good','Strong','Excellent'][n];
    $('b').style.width=n*20+'%';
    $('b').style.background=n<3?'#d63031':n<5?'#fdcb6e':'#00b894'
  };
</script>
  </body>
</html>
