<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Change Text Content
    </title>
    <link rel="stylesheet" href="../assets/style.css">
  </head>
  <body>
    <div class="wrap">
      <h1>
        Change Text Content
      </h1>
      <p class="d">
        Working demonstration of this program.
      </p>
      <p id=t>
        Original text
      </p>
      <button id=b>
        Change
      </button>
      <nav>
        <a class="btn" href="../index.html">
          Home
        </a>
        <a class="btn" href="index.html">
          JavaScript Programs
        </a>
      </nav>
    </div>
    <script>
  const $=i=>document.getElementById(i);
  $('b').onclick=()=>$('t').textContent='Text changed!';
</script>
  </body>
</html>
