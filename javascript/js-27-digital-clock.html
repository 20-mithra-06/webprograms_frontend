<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Digital Clock
    </title>
    <link rel="stylesheet" href="../assets/style.css">
  </head>
  <body>
    <div class="wrap">
      <h1>
        Digital Clock
      </h1>
      <p class="d">
        A live clock updated every second.
      </p>
      <div class="out big" id=o>
      </div>
      <nav>
        <a class="btn" href="../index.html">
          Home
        </a>
        <a class="btn" href="index.html">
          JavaScript Programs
        </a>
      </nav>
    </div>
    <script>
  const $=i=>document.getElementById(i);
  const t=()=>$('o').textContent=new Date().toLocaleTimeString();
  t();
  setInterval(t,1000);
</script>
  </body>
</html>
