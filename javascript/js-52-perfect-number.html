<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Perfect Number
    </title>
    <link rel="stylesheet" href="../assets/style.css">
  </head>
  <body>
    <div class="wrap">
      <h1>
        Perfect Number
      </h1>
      <p class="d">
        Enter the values and press Run to see the result.
      </p>
      <div id=f>
      </div>
      <button id=g>
        Run
      </button>
      <pre class=out id=o style="white-space:pre-wrap">
      </pre>
      <nav>
        <a class="btn" href="../index.html">
          Home
        </a>
        <a class="btn" href="index.html">
          JavaScript Programs
        </a>
      </nav>
    </div>
    <script>
  const $=i=>document.getElementById(i);
  const S=['n'],F=(x,y,z)=>x>1&&[...Array(x-1)].reduce((s,_,i)=>x%(i+1)?s:s+i+1,0)===x?'Perfect':'Not perfect';
  const I=S.map(t=>{
    const e=document.createElement('input');
    e.placeholder={
      n:'Number',a:'Numbers separated by commas',s:'Text'
    }
    [t];
    if(t==='n')e.type='number';
    $('f').appendChild(e);
    return e
  });
  $('g').onclick=async()=>{
    try{
      $('o').textContent=await F(...I.map((e,i)=>S[i]==='n'?+e.value:S[i]==='a'?e.value.split(',').map(Number):e.value))
    }
    catch{
      $('o').textContent='Invalid input'
    }
  };
  if(!S.length)$('g').click();
</script>
  </body>
</html>
