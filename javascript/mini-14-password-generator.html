<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Random Password Generator
    </title>
    <link rel="stylesheet" href="../assets/style.css">
  </head>
  <body>
    <div class="wrap">
      <h1>
        Random Password Generator
      </h1>
      <p class="d">
        Generates a random password of the chosen length.
      </p>
      <input id=n type=number value=12 min=4 max=64>
      <button id=g>
        Generate
      </button>
      <div class=out id=o>
      </div>
      <nav>
        <a class="btn" href="../index.html">
          Home
        </a>
        <a class="btn" href="index.html">
          JavaScript Programs
        </a>
      </nav>
    </div>
    <script>
  const $=i=>document.getElementById(i);
  $('g').onclick=()=>{
    const c='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*';
    let p='';
    for(let i=0;
    i<+$('n').value;
    i++)p+=c[Math.floor(Math.random()*c.length)];
    $('o').textContent=p
  };
</script>
  </body>
</html>
